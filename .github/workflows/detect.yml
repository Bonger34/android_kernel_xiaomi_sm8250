# ══════════════════════════════════════════════════════════════════════════════
#  检测器（上游同步通道 · issue #7 + #8）：**漂移发现 + 心跳 + 试合并 + 触发构建**。
#
#  规格：`docs/los-line/upstream-sync-spec.md`（工作区文档，不在本仓库里）
#    实现决定 1 —— 两个 workflow 职责分开：**只有本文件带 `schedule`**
#      ⇒ 只有它会被 GitHub 的 inactivity 规则停用；构建器（build.yml）只带
#        `workflow_dispatch`，永远点得动，是维护者永远的兜底入口。
#      ⚠️ #8 起本文件还要**触发**构建器 ⇒ `permissions:` 里必须有 `actions: write`
#        （漏了就是 403 `Resource not accessible by integration`）。
#    实现决定 2 —— **直接比上游**，判据是 merge-base（不是「上游 sha == 本地 sha」：
#      我们这条跟随分支永远带着自己的提交，正常情况下也永远不等于上游 HEAD）。
#    实现决定 3 —— 心跳：往一条**孤儿分支**写一个**带真实内容**的提交，距上次 >= 30 天才写。
#      ⚠️ 为什么非做不可：**workflow 自己的运行不算 repository activity**
#      ⇒ 纯 cron 的仓库 60 天后会被静默停用（实测 3 个仓库：停用前 60 天里每天 cron
#        成功运行仍被判 `disabled_inactivity`）；而**非默认分支的 push 算** activity。
#    实现决定 4 —— 底包**由检测器统一取一次**，再分发给两个构建 job（否则两个 job
#      各自「现拉最新」，跨几分钟官网换包会造成**假失败**）。
#    实现决定 7 —— 失败标记与心跳共用**同一个**状态文件（`sync-heartbeat` 分支上的
#      `sync-state.json`）。本工单只写 `heartbeat`；`failed` 由 #10 写。
#
#  ⚠️ **判定逻辑一行都不在 YAML 里**：判定是 `python3 .github/scripts/detect.py`
#     （它再调 `sync-check.py` —— 接缝 S3，纯决策、零 I/O、零网络，28 条离线用例），
#     试合并是 `try-merge.py`（接缝 S5），派发是 `trigger-build.py`。
#     为什么：本机**没有可用的 bash**（Windows），写在 YAML 里的步骤只能上 CI 试
#     （一轮十几分钟）；写成脚本后同一条链在本机就能跑通 —— 而本机有真上游可对。
#     同 `package.py`（issue #5）的理由。
#
#  ⚠️ #8 起本文件**会构建**（间接：派发构建器）。但那四步是**有条件**的：
#     只有 `detect.py` 判出 `drifted` 才走；无漂移时一次运行仍是 50 秒左右就结束。
#
#  ⚠️ **本文件永远不推工作分支**（#9 起这条更明确）：它只读它、试合并、派发。
#     推工作分支只发生在构建器那边的最后一步，且必须在整条链全绿之后。
#     本文件的「收尾复核」正是这条不变量的反向守卫 —— 分支在本次运行里动过就**响亮地红**。
#
#  ⚠️ #9 起本文件会推**一条临时 ref**（`sync-staging`）—— 那是**运输工具，不是发布判据**：
#     本地 `commit-tree` 造的合并提交**服务端根本不存在**（实测历史合并提交 REST 全 404），
#     于是构建全绿之后 `PATCH refs/heads/<工作分支>` 会回
#     `{"message": "Object does not exist"}`（run 36311829440 实测）。
#     让那个提交经过一条 ref 之后它才成为服务端对象 —— 而那一条**绝不是工作分支**。
#     ℹ️ 这处决定改了规格里「试合并**绝不 push**」那句字面约束（用户 2026-09-27 裁定，方案 A）；
#        它的**目的**（工作分支不提前前进）完整保住，且工作分支那一步**永远** `force: false`。
#
#  ⚠️ #10 起本文件**红了会自己叫人**：末尾多了一步 `if: failure()`，
#     用同一个 `report-failure.py` 开 issue（**检测器自身失败最常见的就是试合并冲突**，
#     而冲突**不会自己消失** —— 没有这一步的话，那个上游提交会让每一天都红一次，
#     直到有人碰巧看见）。它同时会把「这个上游提交已试过」记进失败标记，
#     于是 7 天内不再为它重复跑检测（过期后自动重试）。
# ══════════════════════════════════════════════════════════════════════════════
name: Detect upstream drift (heartbeat + drift)

on:
  schedule:
    # 每天一次（UTC）。⚠️ 分钟取 **17** 而不是 0：GitHub 的定时队列在整点最挤
    # （官方文档明说高负载时会延迟甚至丢弃）。这条通道的价值是「每天都跑」，
    # 晚十几分钟毫无影响；被挤掉一次才是真损失。
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "演练：只判定，**不写心跳、也不试合并 / 不取底包 / 不派发构建**（置 true 会让本次按设计跳过那四步）"
        required: false
        default: "false"
      upstream_repo:
        description: "⚠️ 测试钩子：把上游换成别的仓库（留空 = LineageOS/android_kernel_xiaomi_sm8250）"
        required: false
        default: ""
      upstream_ref:
        description: "⚠️ 测试钩子：把上游 ref 换成别的分支或 sha（留空 = lineage-23.2）。配 `sync-drift-sim` 分支可**手动制造一次真漂移**"
        required: false
        default: ""

# ⚠️ **一旦写了 `permissions:`，没列出的权限一律变 `none`。**
#    `contents: write` 是写心跳分支要的（`contents: read` 已经含在里面，checkout 也要它）。
#    `actions: write` 是 #8 用 `GITHUB_TOKEN` 触发构建器要的
#    （缺了就是 403 `Resource not accessible by integration`，规格实现决定 1 的原话）。
#    `issues: write` 是 #10 的失败上报要的（开 issue / 追加评论）——
#    ⚠️ `actions: write` 只覆盖 actions 那一族，**不含** issue。
permissions:
  contents: write
  actions: write
  issues: write

# 一天一次 + 随时可能手动触发：两次同时跑会撞同一份状态文件。CAS 会让后者响亮地 409
# （不会互相覆盖，这一点是好的），但那是一次没必要的红。排队等一下比丢掉一次好。
concurrency:
  group: sync-detect
  cancel-in-progress: false

env:
  # 本线的**跟随分支**（= 本仓库默认分支）。上游同步的一切都对着它。
  # ⚠️ 「加一条分支 = 改一个变量」的落点就是这几行（规格实现决定 9 / 用户故事 31）。
  WORK_BRANCH: ksu-lineage-23.2
  # ⚠️ 这两个默认值可以被 `workflow_dispatch` 的两个**测试钩子**覆盖：上游 `lineage-23.2`
  #    自 2026-07-13 起没动过 ⇒ 「漂移 → 试合并 → 触发构建」这条主干在真上游上
  #    **等不到一次触发**，而它恰恰是本工单要验的东西（见 docs/los-line/tickets.md 的 #8 一节）。
  #    用 `github.event.inputs`（而不是 `inputs`）是因为它在 schedule 触发时同样存在（为 null）。
  UPSTREAM_REPO: ${{ github.event.inputs.upstream_repo || 'LineageOS/android_kernel_xiaomi_sm8250' }}
  UPSTREAM_BRANCH: ${{ github.event.inputs.upstream_ref || 'lineage-23.2' }}
  # 被触发的那个 workflow 的**文件名**（`workflow_dispatch` 按文件名定位）。
  BUILD_WORKFLOW: build.yml
  # 心跳分支：**孤儿分支**，与任何工作分支没有共同历史（用户故事 23：
  # 「不碰任何工作分支 ⇒ 不会移动分支头、不影响构建时间戳、不和自动合并抢分支」）。
  # ⚠️ 这个值必须与 `detect.py` 的 `HEARTBEAT_BRANCH` 一致 —— 那个默认值只在**本机手跑**
  #    时生效（CI 永远用这里传过去的值）。两处写歪一个，本机手跑与 CI 就会写到**两条**
  #    分支上去，而两边看起来都是绿的。改这里时顺手改那一行。
  HEARTBEAT_BRANCH: sync-heartbeat
  # 临时 ref：**只用来把那次合并的提交「种子投放」到服务端**（#9）。
  # ⚠️ 它不是发布判据 —— 工作分支要等构建全绿才前进（见下面那一步的长注释）。
  # ⚠️ 必须与 `build.yml` 的 `STAGING_REF` 一致（那边用它做推前复核与收尾清理）。
  STAGING_REF: sync-staging

jobs:
  detect:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      # ⚠️ `ref:` 显式钉住工作分支：本工作流可以被手动派发到**任何** ref 上
      #    （「检测器被停用时恢复只要点几下」那条验收），而我们要跑的永远是跟随分支上那份
      #    检测器 —— 否则手动选错 ref 会跑出一份别处的脚本，而且没人看得出来。
      # `fetch-depth: 1` 够了：本步骤只用仓库里的脚本，不做任何 git 历史运算
      #（merge-base 走 API 取，理由见 detect.py 的文件头）。
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.WORK_BRANCH }}
          fetch-depth: 1

      - name: "检测：漂移发现 + 心跳"
        id: detect
        env:
          # ⚠️ 用仓库自带的 `GITHUB_TOKEN`，**不用 PAT** —— 这条通道不该有任何长期凭据
          #    （规格用户故事 32）。
          GH_TOKEN: ${{ github.token }}
          # 写进心跳内容：它是「这一次运行」的记号，也是事后追溯的入口。
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # 定时触发时 `inputs` 是空的 ⇒ 这里拿到空串，下面按「非 true 即 false」处理。
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          ARGS=( --repo "$GITHUB_REPOSITORY"
                 --branch "$WORK_BRANCH"
                 --upstream-repo "$UPSTREAM_REPO"
                 --upstream-branch "$UPSTREAM_BRANCH"
                 --heartbeat-branch "$HEARTBEAT_BRANCH"
                 --run-url "$RUN_URL"
                 --summary "$GITHUB_STEP_SUMMARY"
                 --github-output "$GITHUB_OUTPUT"
                 --json-out detect.json )
          if [ "$DRY_RUN" = "true" ]; then
            echo "⚠️ dry-run：只判定，不写心跳（心跳仍会报「到期」）"
            ARGS+=(--dry-run)
          fi

          # ⚠️ 退出码**有语义**：0/10/20/30 是 S3 的四选一结论，**四个都是正常结论**。
          #    写成「非零即报错」的话，一次正常的「有漂移」会被当成工具崩了 ——
          #    而这条通道最常见的正常状态恰恰就是「有漂移」。
          set +e
          python3 .github/scripts/detect.py "${ARGS[@]}"
          RC=$?
          set -e

          case "$RC" in
            0|10|20|30) echo "✅ 检测完成：退出码 $RC" ;;
            *)
              echo "❌ 检测器本身失败（退出码 $RC）：1 = 运行错误，2 = 用法错误"
              echo "   四个正常结论是 0（无漂移）/ 10（有漂移）/ 20（已拉黑）/ 30（该写心跳了）。"
              exit "$RC"
              ;;
          esac
          echo "──────── 机器可读的结果（detect.json）────────"
          if [ -f detect.json ]; then cat detect.json
          else echo "（没有 detect.json —— 检测器没走到写它的那一步）"; fi
          echo "───────────────────────────────────────────────"

          # ⚠️ **运行摘要**是这条通道唯一被人读的东西（一天一次，没人会去翻日志），
          #    而「它写没写成功」在界面上**看不出来**：摘要为空时那次运行照样是绿的。
          #    ⇒ 把「非空」做成一道检查，并把内容打进日志 —— 于是它可核验、也留得下证据。
          #
          # 🚨 **必须在本步之内查**：`$GITHUB_STEP_SUMMARY`（以及 `GITHUB_OUTPUT`）是
          #    **每个 step 一个**的临时文件，runner 在这一步**结束后**才把它并进 job summary
          #    ⇒ 下一步读它是**空的**。第一版把它写成后面单独一步，于是它**必然失败**
          #    （实测：run 36263004895 红在那一句上）。这一类「只在 CI 上出现」的错误
          #    与坑表 #37 同族：本机没有 runners 的 step 概念，跑不出来。
          #    ⚠️ 但**追加**是安全的：后面几步各自往自己那份里写，最后一起并进 job summary。
          if [ ! -s "$GITHUB_STEP_SUMMARY" ]; then
            echo "❌ 运行摘要为空 —— detect.py 的 --summary 没写成功，而运行照样会是绿的"
            exit 1
          fi
          echo "运行摘要 $(wc -c < "$GITHUB_STEP_SUMMARY") 字节，逐字如下："
          echo "┌───────────────────────────────────────────────"
          cat "$GITHUB_STEP_SUMMARY"
          echo "└───────────────────────────────────────────────"

      # ⚠️ 这一节是给 #8 的**接口 + 一次真检查**：`state` / `upstream_sha` / `merge_base`
      #    正是 #8「试合并 → 取底包 → 触发构建」要往下传的三个值。
      #    但它不只是打印 —— `--github-output` 那条路一旦坏掉，这里会**当场红**，
      #    而不是等到 #8 拿着一个空值去试合并（那时报的是另一件事，查起来贵得多）。
      - name: "检查结果确实传了出来（#8 接的就是这几个值）"
        run: |
          set -euo pipefail
          STATE="${{ steps.detect.outputs.state }}"
          UP="${{ steps.detect.outputs.upstream_sha }}"
          LO="${{ steps.detect.outputs.local_sha }}"
          MB="${{ steps.detect.outputs.merge_base }}"
          if [ -z "$STATE" ]; then
            echo "❌ 没拿到 state —— detect.py 的 --github-output 没写成功"
            exit 1
          fi
          if [ -z "$UP" ] || [ -z "$LO" ] || [ -z "$MB" ]; then
            echo "❌ 没拿全三个 sha：upstream='$UP' local='$LO' merge_base='$MB'"
            exit 1
          fi
          echo "state      = $STATE（退出码 ${{ steps.detect.outputs.exit_code }}）"
          echo "upstream   = $UP"
          echo "local      = $LO"
          echo "merge_base = $MB"
          echo "心跳       = 到期 ${{ steps.detect.outputs.heartbeat_due }} / 已写 ${{ steps.detect.outputs.heartbeat_written }}"
          if [ "$STATE" = "drifted" ]; then
            echo "⇒ 有漂移：#8 起下面会试合并 → 取底包 → 触发构建（本工单之前只打印结论）。"
          else
            echo "⇒ 不是 drifted：**不试合并、不取底包、不触发构建**，到此为止。"
          fi

      # ══ #8：漂移 → 试合并 → 取底包 → 触发构建 ════════════════════════════════
      # 四步的顺序本身就是判据，不是风格：
      #   ① 试合并 —— 冲突就**到此为止**：不取底包、不派发、不留半成品（实现决定 2）；
      #   ② 取底包 —— **整条通道只取一次**，两个 build job 共用这一份（实现决定 4）；
      #      两个 job 各自「现拉最新」的话，官网恰好跨期就会产出不同的字节 —— 那是**假失败**；
      #   ③ 传 artifact —— build 那边靠 `base_run_id` + `base_artifact` 取回**同一份**；
      #   ④ 派发构建 —— 用仓库自带的 `GITHUB_TOKEN`（不是 PAT），并把上游提交 / 合并基点 /
      #      合并提交 / 底包 sha256 **一起传过去**（`trigger-build.py --require` 拦空值）。
      #
      # ⚠️ 四步都额外挂了 `github.event.inputs.dry_run != 'true'`：`dry_run` 的语义是**演练**，
      #    而一次演练顺带取 128 MiB 底包、传 artifact、再触发 30 分钟 × 2 的编译，
      #    不是演练该有的后果（`dry_run` 那一条入参的说明里写清了这一点）。
      #    ⚠️ 用 `github.event.inputs.*` 而不是 `inputs.*`：定时触发时前者是 **null**、
      #    后者是**空串**，两种写法在这里都为真 —— 但本文件另外两处钩子已经是前者，
      #    同一个文件里不留第二种写法（也就不必去赌 `inputs` 在某处的可用性）。
      - name: "试合并：把上游合进本线（绝不 push）"
        id: merge
        if: steps.detect.outputs.state == 'drifted' && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # ⚠️ `--merge-base` 传的是**API 给出的**那个（不是本地算的）：浅历史里
          #    `git merge-base` 只会返回它还看得见的那一个，拿截断的祖先去合并会得到
          #    一次**不报错的错合并**。工具会断言两者相等。
          python3 .github/scripts/try-merge.py \
            --repo-dir . \
            --work-branch "$WORK_BRANCH" \
            --local-sha "${{ steps.detect.outputs.local_sha }}" \
            --upstream-url "https://github.com/${UPSTREAM_REPO}.git" \
            --upstream-sha "${{ steps.detect.outputs.upstream_sha }}" \
            --merge-base "${{ steps.detect.outputs.merge_base }}" \
            --github-output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY"

          # ★ 验收「运行前后**工作分支完全不变**」——**当场复核**，不是一句承诺。
          #   试合并跑在 detached HEAD 上（工具自己摘的），这一句是它的反面证据：
          #   远端那条分支的 sha 必须仍等于检测器开头读到的那一个。
          NOW="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$WORK_BRANCH" --jq .object.sha)"
          BEFORE="${{ steps.detect.outputs.local_sha }}"
          if [ "$NOW" != "$BEFORE" ]; then
            echo "❌ 工作分支 $WORK_BRANCH 动了：$BEFORE → $NOW"
            echo "   「试合并绝不碰工作分支」是这条通道的硬约束（规格实现决定 2 与 10）。"
            exit 1
          fi
          echo "✅ 复核：$WORK_BRANCH 仍是 $NOW —— 试合并一个字节都没动它"
          # ⚠️ 摘要里**必须用 shell 变量**，不能用 `${{ steps.merge.outputs.* }}` ——
          #    一个 step **自己的** outputs 要等它跑完才存在，在同一 step 里引用会渲染成**空**。
          #    （实测踩到：第一版这里写出了「合并提交 ``（父 = ...）」这种空值，
          #      而这行摘要正是人唯一会看的东西。）
          MSHA="$(git rev-parse HEAD)"
          { echo ""; echo "### 试合并（#8）"; echo ""
            echo "- 合并提交 \`$MSHA\`（父 = 本线 HEAD \`$BEFORE\` + 上游提交）"
            echo "- 工作分支 \`$WORK_BRANCH\` 复核后仍是 \`$NOW\` —— **没动**"
            echo "- 复核用 \`gh api\` 读**远端** ref（不是读本地）——本地那条分支本来就不是判据"; } \
            >> "$GITHUB_STEP_SUMMARY"

      # ══ #9：给这次合并**做种子投放** ══════════════════════════════════════════
      # 🚨 **为什么非做不可**（2026-09-27 实测，不是推断）：
      #    合并提交是 runner 上 `git commit-tree` 造出来的，**不在任何 ref 上**
      #    ⇒ **服务端根本没有这个对象**。证据：`GET /git/commits/<三个历史合并提交>`
      #    **全 404**（包括刚在 CI 里被 `actions/checkout` 成功检出的那一个）；
      #    而由 Git Data API 造的对象读得回来。于是构建全绿之后那一步
      #    `PATCH refs/heads/<工作分支>` 回 **`{"message": "Object does not exist"}`**。
      #    ⚠️ **「能检出」≠「服务端认它」** —— 这是最容易误判的一点。
      #    ⚠️ 也**不能**改用「API 自己造那个合并提交」：API 会把 `+08:00` 规范成 `Z`
      #    ⇒ 服务端造的 sha 与本地重放的**必然不同**，两个 build job 会对不上。
      #
      # ⇒ 唯一的路：让那个提交**经过一条 ref**成为服务端对象。
      #    ⚠️ **那条 ref 绝不是工作分支** —— 工作分支必须等全绿（这是 #9 的全部意义）。
      #    所以推到一条**临时 ref**（`sync-staging`）里当运输工具：
      #      · 它的存在**不代表**「这批可以发」—— 没有任何产物对着它发；
      #      · 构建全绿之后 `repro` 才把**工作分支**快速前进过去，然后删掉它；
      #      · 它**不在** `ksu-*` / `lineage-*` 命名空间里（那是工作分支与上游镜像分支），
      #        与心跳分支 `sync-heartbeat` 同一个 `sync-` 前缀，一眼看得出是这条通道的。
      #
      # ⚠️ `--force` 是**故意**的：temp ref 是**纯运输工具**，没有「历史」可言；
      #    不用 force 的话，某次失败留下的旧种子会让下一轮推送被拒（一次无意义的红）。
      #    工作分支那边**永远**是 `force: false`（`promote.py` 里唯一的写操作）。
      - name: "种子投放：把合并提交推到临时 ref（服务端才会认它）"
        if: steps.detect.outputs.state == 'drifted' && github.event.inputs.dry_run != 'true'
        env:
          # ⚠️ 这一步要用它两处：`git push` 的 URL 里、以及 `gh api` 复核时。
          #    没在这一步的 env 里声明的话，`$GH_TOKEN` 会是空的 ——
          #    而**空的 token 不会让 `gh api` 报错**，它会退化成未认证请求（读接口碰巧还能通）。
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MSHA="${{ steps.merge.outputs.merge_sha }}"
          if [ -z "$MSHA" ]; then
            echo "❌ 拿不到合并提交的 sha —— 种子投放无从做起"
            exit 1
          fi
          echo "把 $MSHA 推到 refs/heads/$STAGING_REF（临时 ref，纯运输工具）"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "$MSHA:refs/heads/$STAGING_REF"
          # ★ 推完**读远端**复核：服务端现在真的认它了吗？（这一条是本步骤的判据）
          NOW="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$STAGING_REF" --jq .object.sha)"
          if [ "$NOW" != "$MSHA" ]; then
            echo "❌ 推完复核不符：$STAGING_REF 是 $NOW，期望 $MSHA"
            exit 1
          fi
          echo "✅ 复核：refs/heads/$STAGING_REF = $NOW"
          # ★★ 真正的判据：**服务端现在能不能 REST 读到这个提交**
          #     （这正是 `PATCH ref` 当初失败的地方 —— 读得到才推得动）
          CODE="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$MSHA" --jq .sha 2>/dev/null || echo '')"
          if [ "$CODE" != "$MSHA" ]; then
            echo "❌ 服务端还是读不到这个提交（/git/commits/$MSHA）"
            echo "   ⇒ 种子投放没生效，后面那一步推分支**必然**回 Object does not exist。"
            exit 1
          fi
          echo "✅✅ 服务端已认它：GET /git/commits/$MSHA -> 200"
          { echo ""; echo "### 种子投放（#9）"; echo ""
            echo "合并提交 \`$MSHA\` 已推到临时 ref \`$STAGING_REF\`。"
            echo ""
            echo "**为什么需要这一步**：本地 \`commit-tree\` 造的对象**服务端不存在**"
            echo "（实测历史合并提交 REST 全 404），于是构建全绿后 \`PATCH ref\` 会回"
            echo "\`Object does not exist\`。经一条**临时 ref**（而不是工作分支）之后，"
            echo "它才成为服务端对象。"
            echo ""
            echo "⚠️ 工作分支 \`$WORK_BRANCH\` **仍然没动** —— 那条 ref 才是「可发布」的判据。"; } \
            >> "$GITHUB_STEP_SUMMARY"

      - name: "取底包：**整条通道只取一次**，两个 build job 共用这一份"
        if: steps.detect.outputs.state == 'drifted' && github.event.inputs.dry_run != 'true'
        run: |
          set -euo pipefail
          # ⚠️ 现拉**官方最新**一期（规格实现决定 4）。期次不钉死是**故意**的：
          #    「每次现拉最新」换来零维护；要钉死的是「两个 build job 用同一份」。
          python3 .github/scripts/fetch-base.py --latest --out base.img | tee base-fetch.log
          BSHA="$(sha256sum base.img | cut -d' ' -f1)"
          echo "$BSHA" > base.sha256
          echo "  实际下载件 sha256 = $BSHA"
          if ! grep -qF "$BSHA" base-fetch.log; then
            echo "❌ 取底包那一步记下的 sha256 与实际文件不符。"
            echo "   实际 $BSHA"; sed -n '1,20p' base-fetch.log; exit 1
          fi
          echo "  ✅ 与取底包那一步记的那一行一致"
          # ⚠️ 期次要跟着底包一起传下去：build 那边复用这份 artifact 时会把
          #    `base-fetch.log` **整份重写**（来源写成 `artifact:<run>/<name>`），
          #    期次不单独传就会只剩「（未钉期次）」—— 来源说明里那条记录就没了。
          sed -n 's/^期次[[:space:]]*//p' base-fetch.log | head -1 > base.date
          echo "  期次（要传给构建器）= $(cat base.date)"
          # ⚠️ 这份日志要写成 `fetch-base.py` **同样的三行形状**（期次 / 来源 / 官方 sha256）——
          #    build 那边的封装链按那个形状解析（`make-provenance.py`），也是复用那条路
          #    写日志时踩过的坑（2026-09-26）。
          { echo ""; echo "### 底包（两个 build job 共用这一份）"; echo ""
            echo '```'; cat base-fetch.log; echo "复算 sha256 $BSHA"; echo '```'
            echo "⚠️ artifact 90 天后过期；这份底包从此谁也重建不了（规格实现决定 4 的已知代价）。"; } \
            >> "$GITHUB_STEP_SUMMARY"

      # ⚠️ artifact 名里带**合并提交**：build 那边要传的就是这个名字。用 merge_sha 而不是
      #    run id，是因为「哪一份底包属于哪一次合并」得一眼看得出来。
      - uses: actions/upload-artifact@v4
        if: steps.detect.outputs.state == 'drifted' && github.event.inputs.dry_run != 'true'
        with:
          name: base-img-${{ steps.merge.outputs.merge_sha }}
          path: |
            base.img
            base-fetch.log
            base.sha256
          if-no-files-found: error

      - name: "触发构建器（仓库自带 GITHUB_TOKEN，不用 PAT）"
        if: steps.detect.outputs.state == 'drifted' && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # ★ 七个入参**一个都不能空**：空的 `merge_sha` 会让构建器按「不合并」跑，
          #   产出一批**没有上游改动**的东西，而那次运行是**绿的** —— 最坏的一种失败；
          #   空的 `upstream_url` 会让构建侧重放合并时去默认的 LineageOS 仓库取那个 sha，
          #   而上游换成别的仓库（本文件的测试钩子）时**那就取不到**。
          #   `--require` 就是为这些设的：缺一个就**一个请求都不发**（退出码 2）。
          #
          # ⚠️ **#9 的推分支核的「本线 HEAD」不在这里传**：它就是合并提交的**父[0]**，
          #   构建器那一步从对象里现取。本工单实测过「单开一个 input」那条路 ——
          #   `workflow_dispatch` 的 inputs 超限，**这次派发当场 422**。
          python3 .github/scripts/trigger-build.py \
            --repo "$GITHUB_REPOSITORY" --workflow "$BUILD_WORKFLOW" --ref "$WORK_BRANCH" \
            --input upstream_sha="${{ steps.detect.outputs.upstream_sha }}" \
            --input merge_base="${{ steps.detect.outputs.merge_base }}" \
            --input merge_sha="${{ steps.merge.outputs.merge_sha }}" \
            --input base_run_id="${{ github.run_id }}" \
            --input base_artifact="base-img-${{ steps.merge.outputs.merge_sha }}" \
            --input base_sha256="$(cat base.sha256)" \
            --input base_date="$(cat base.date)" \
            --input upstream_url="https://github.com/${UPSTREAM_REPO}.git" \
            --require upstream_sha --require merge_sha --require merge_base \
            --require base_run_id --require base_artifact --require base_sha256 \
            --require upstream_url
          { echo ""; echo "### 触发构建"; echo ""
            echo "已派发 \`$BUILD_WORKFLOW\` @ \`$WORK_BRANCH\`（用仓库自带的 \`GITHUB_TOKEN\`）。"
            echo ""
            echo "⚠️ 派发接口**不返回 run id** —— 「哪一次」按时间 + 输入里的 \`merge_sha\` 对。"
            echo "⚠️ 本通道**只出 CI artifact，不碰 release**（发布仍由人手动做）。"
            echo "⚠️ 「工作分支全绿才前进」是**构建器那一步**的活（#9）：本次运行**不推分支**。"
            echo ""; echo "👉 https://github.com/$GITHUB_REPOSITORY/actions/workflows/$BUILD_WORKFLOW"; } \
            >> "$GITHUB_STEP_SUMMARY"

      # ⚠️ 这一条是 #9 的**反向守卫**：本 workflow **任何情况下都不推工作分支**。
      #    推分支只发生在构建器那边，且必须在整条链全绿之后（issue #9）。
      #    这里是它成立的前提 —— 检测器跑完之后，分支仍是它开头读到的那个提交。
      - name: "收尾复核：本次运行没有推进工作分支（推分支是构建器的活，#9）"
        if: steps.detect.outputs.state == 'drifted' && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOW="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$WORK_BRANCH" --jq .object.sha)"
          BEFORE="${{ steps.detect.outputs.local_sha }}"
          if [ "$NOW" != "$BEFORE" ]; then
            # ⚠️ 这里**不能**放宽成「只要 NOW 是 BEFORE 的后代就算过」。两条理由：
            #   ① 本 workflow 里没有任何推分支的代码 ⇒ 唯一变动的可能是**别人**在动它，
            #      而那正是该被人看见的事（同一条分支上两个 writer）；
            #   ② 真出现那种情况时，本轮试合并算出来的 merge_sha 已经**不是**分支 HEAD 的
            #      快速前进目标了 —— 构建器那边的 promote.py 会判「分支已前进」（退出码 3）
            #      并**让路**，两个 writer **不会互相覆盖**（`force: false` 再加一道）。
            echo "❌ 工作分支 $WORK_BRANCH 从 $BEFORE 变成了 $NOW"
            echo "   本 workflow **只试合并不推分支**；推分支是构建器在全绿之后做的（#9）。"
            echo "   ⇒ 说明有**别的东西**写了这条分支（并发的构建器？有人手推？）。"
            echo "      本轮算出的 merge_sha 已经不是它的快速前进目标了，构建器那边会让路。"
            exit 1
          fi
          echo "✅ 工作分支仍是 $NOW —— 检测器一个字节都没动它"
          { echo ""; echo "### 收尾"; echo ""
            echo "✅ \`$WORK_BRANCH\` 从头到尾是 \`$NOW\` —— 检测器**一个字节都没推**。"
            echo "（推分支是构建器在全绿之后做的：issue #9。）"; } >> "$GITHUB_STEP_SUMMARY"

      # ══ #10：红了叫人 ═════════════════════════════════════════════════════════
      # **检测器自身失败也要叫人。** 最常见的形态是**试合并冲突**（fixture `sync-conflict-sim`
      # 那一次的 run 36270791644 就是：红的，而**没有任何人被叫** —— 那正是 #10 的活）。
      #
      # 为什么这一档比构建失败**更**需要自动通知：冲突**不会自己消失**，而检测器每天跑一次
      # ⇒ 没有这一步就变成「同一个上游提交每天都红一次」，直到有人碰巧打开 Actions 页面。
      # 记下失败标记之后，7 天内不再为它重复跑（过期后自动重试）。
      #
      # ⚠️ 与构建器那条路的**唯一**区别：这里没有产物（检测器不编译），
      #    issue 正文会如实写「这次没有产物」。其余完全相同：同一个工具、同一份标记、同一套去重。
      #
      # ⚠️ `--upstream-sha` 取自**检测那一步**的输出：若失败发生在检测那一步**本身**
      #    （例如 API 抖动 / 限流），它是空的 ⇒ 工具判 `no-upstream` 并**什么都不做**。
      #    那是有意的：一次网络抖动不该开 issue，也不该让某个提交被拉黑 7 天
      #    （规格实现决定 7：基础设施抖动会自动重试）。
      - name: "红了叫人：检测器自身失败也开 issue（冲突无法自愈，#10）"
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # ⚠️ **不传 `--self-job`**：它的默认值就是 `GITHUB_JOB`（= 本 job 的 id），
          #    在这里再写一遍就是同一个事实两处各记一份（漂移后果是静默的，见 build.yml 的同款注释）。
          # `--base-sha256` 用 `|| true` 兜底：底包是**后面**那一步才取的，
          # 试合并冲突时这份文件根本不存在 —— 那种情形下这一栏如实留空。
          python3 .github/scripts/report-failure.py \
            --repo "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --upstream-sha "${{ steps.detect.outputs.upstream_sha }}" \
            --merge-sha "${{ steps.merge.outputs.merge_sha }}" \
            --merge-base "${{ steps.detect.outputs.merge_base }}" \
            --base-sha256 "$(cat base.sha256 2>/dev/null || true)" \
            --work-branch "$WORK_BRANCH" \
            --heartbeat-branch "$HEARTBEAT_BRANCH" \
            --json-out report-failure.json \
            --summary "$GITHUB_STEP_SUMMARY"
          echo "──────── 机器可读的结果（report-failure.json）────────"
          cat report-failure.json
          echo "───────────────────────────────────────────────"
