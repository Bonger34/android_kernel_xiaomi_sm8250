name: Build Kernel (KernelSU)
on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: base defconfig
        required: true
        default: vendor/kona-perf_defconfig
      fragments:
        description: config fragments (space separated)
        required: false
        default: arch/arm64/configs/vendor/debugfs.config arch/arm64/configs/vendor/xiaomi/sm8250-common.config arch/arm64/configs/vendor/xiaomi/umi.config
      disable_hardening:
        description: disable CFI/SCS/WERROR, keep LTO (true/false)
        required: false
        default: "false"
      clang_repo:
        description: clang prebuilt repo
        required: false
        default: LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b
      sentinel_self_test:
        description: "环境哨兵负向自测：故意换掉已知输入，哨兵必须失败、构建必须中止（true/false）"
        required: false
        default: "false"
      base_date:
        description: "底包期次 YYYY-MM-DD（留空 = 现拉官方最新一期，见规格实现决定 4）"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      # ── 可复现构建：三个变量必须固定 ──────────────────────────────────
      # scripts/mkcompile_h L37-51：不设则退回 `date` / `whoami` / `uname -n`，
      # 而 GitHub runner 的主机名每次随机 ⇒ 两次构建的 uname -v 与 banner 必不同。
      TZ: UTC
      KBUILD_BUILD_USER: bonger
      KBUILD_BUILD_HOST: github-actions
      # ── 封装链用到的 AK3 模板钉值（issue #5）────────────────────────────
      # ⚠️ 上游 `osm0sis/AnyKernel3@master` 是**会动**的：它变了，zip 的字节就会变
      #    （anykernel.sh 的内容与 tools/magiskboot 都会进 zip）。钉住 ⇒ 上游一改版
      #    **当场失败**，而不是悄悄产出一批用别的模板做的 zip。
      #    要接受新模板就改这一行 —— 那是**人的决定**，不该由构建代劳。
      AK3_TEMPLATE_URL: https://codeload.github.com/osm0sis/AnyKernel3/tar.gz/refs/heads/master
      AK3_TEMPLATE_SHA256: a74f8acd2a0855460e16c31a79db344b22c22f082432d946d2db3c727f59a921
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ══ ⭐ 环境哨兵（接缝 S2；规格 = **工作区**文档 docs/los-line/upstream-sync-spec.md §6）══
      # 位置：**编译之前的第一步**。它失败 ⇒ 整个 job 立刻中止，不浪费 15 分钟去编译一堆
      #       建立在错误字节上的东西。
      #
      # 判据：把已发布的 CFI 内核装进已发布的正式版壳里，必须**逐字节**得到已发布的
      #       CFI 版 boot.img（sha256 24f29222…）。
      #
      # 为什么非做不可：重打包要用**原版 zlib** 把 ramdisk 重新压缩一遍，输出字节随 zlib
      #   版本变（实测 1.2.11 与 1.2.13 一致；**1.3.x 在已验证区间外**）。runner 镜像一换，
      #   后面每一步都会在错误的字节上盖楼，而且**不会报错**。
      #   ⇒ 这也是 `runs-on` 必须钉死在 ubuntu-22.04 的原因（24.04 的 python3 用 zlib 1.3）。
      #
      # ⚠️ 为什么壳用「正式版」、内核用「CFI 版」：
      #   两个 release 的壳来自**同一份底包**（T6 已证：ramdisk 解压后逐字节相同），而 repack
      #   只从壳里读 ramdisk / dtb / vbmeta / header —— **独独不读壳里的那个内核**。
      #   ⇒ repack(正式版 boot.img, CFI Image) ≡ repack(底包, CFI Image) = CFI 版 boot.img。
      #   这样**期望值与两个输入件三者互不相同**（期望 24f29222… ≠ 壳 4c556237… ≠ 内核 3a9e1c20…），
      #   不会退化成「拿文件跟自己比」—— 那种检查把工具换成一句 `cp` 也照样能过。
      #
      # 本步骤用到的**每一个哈希**都取自**工作区**里的 `docs/manifests/los-releases-sha256.txt`
      # （已发布资产的钉值）。⚠️ 重发资产 / 换 release 之后必须同步改这里 ——
      # 期望值变了，哨兵就该响亮地失败。
      - name: "Environment sentinel — repack must reproduce published bytes"
        env:
          BASE_URL: https://github.com/${{ github.repository }}/releases/download/ksu-v0.9.5-lineage23.2-umi/boot-LOS23.2-ksu-0.9.5-umi.img
          BASE_SHA: 4c556237ded71dba55b27aa2dce18d36b9f2f3de55dbb3df36d52e2b4dc79035
          KERNEL_URL: https://github.com/${{ github.repository }}/releases/download/ksu-v0.9.5-lineage23.2-cfi-umi/Image-micode-4.19.325-perf-gb9c8bf5e4b79-LOS23.2-cfi-ksu-0.9.5
          KERNEL_SHA: 3a9e1c208795179595c60b6ffba25ed33605b179d366bc74b40f28980c2945c1
          EXPECT_SHA: 24f2922235b5ea63819dacee3101cec7d1be964b21cecf5e648da3ad397fc157
          # 负向自测用的**另一对**已发布件（同样是钉死的哈希）
          ALT_BASE_URL: https://github.com/${{ github.repository }}/releases/download/ksu-v0.9.5-lineage23.2-cfi-umi/boot-LOS23.2-cfi-ksu-0.9.5-umi.img
          ALT_BASE_SHA: 24f2922235b5ea63819dacee3101cec7d1be964b21cecf5e648da3ad397fc157
          ALT_KERNEL_URL: https://github.com/${{ github.repository }}/releases/download/ksu-v0.9.5-lineage23.2-umi/Image-micode-4.19.325-perf-gb9c8bf5e4b79-LOS23.2-ksu-0.9.5
          ALT_KERNEL_SHA: 0157c33f9a4a048cde921402ba832c666436671b4426851370c21864a86c4334
          SELF_TEST: ${{ inputs.sentinel_self_test }}
        run: |
          set -euo pipefail
          mkdir -p sentinel
          echo "python3 : $(python3 -VV)"
          echo "zlib    : $(python3 -c 'import zlib; print(zlib.ZLIB_VERSION, zlib.ZLIB_RUNTIME_VERSION)')"
          echo "runner  : ${ImageOS:-?} ${ImageVersion:-?}"

          if [ "$SELF_TEST" = "true" ]; then
            echo "⚠️  负向自测模式：壳 正式版→CFI 版、内核 CFI 版→正式版，**期望值不动**"
            echo "    本步骤**必须失败** —— 它通过就说明哨兵（或重打包工具）已经坏了。"
            echo "    下面报的『最可能的原因』对本次**不适用**：真因是输入被**故意**换掉了。"
            BASE_URL="$ALT_BASE_URL"
            BASE_SHA="$ALT_BASE_SHA"
            KERNEL_URL="$ALT_KERNEL_URL"
            KERNEL_SHA="$ALT_KERNEL_SHA"
          fi

          # 输入件也要钉死：否则 release 上的资产被换掉时，哨兵会"通过"一次错的比对。
          fetch () {  # $1=URL  $2=期望 sha256  $3=落地路径
            curl -fsSL --retry 3 --retry-delay 2 -o "$3" "$1"
            local got
            got="$(sha256sum "$3" | cut -d' ' -f1)"
            if [ "$got" != "$2" ]; then
              echo "❌ 输入件不是期望的那一份: $3"
              echo "   期望 $2"
              echo "   实际 $got"
              echo "   ⇒ 最可能的原因：release 上的资产被重新上传/删除（哈希清单该更新了），"
              echo "     或下载被截断（大文件会静默截断，见项目文档 PROJECT.md §7 坑表 #21）。"
              exit 1
            fi
            echo "✅ 输入件 $3  $got"
          }

          fetch "$BASE_URL"   "$BASE_SHA"   sentinel/base.img
          fetch "$KERNEL_URL" "$KERNEL_SHA" sentinel/kernel.img

          # ★ 判据本体。失败时工具自己会打印「期望 / 实际 / 最可能的原因」三件事。
          python3 .github/scripts/repack-boot.py sentinel/base.img sentinel/kernel.img -o sentinel/boot.img --expect "$EXPECT_SHA"

          echo "✅ 环境哨兵通过：本 runner 的重打包环境与已发布件逐字节一致"
          echo "   复算件 sentinel/boot.img sha256 = $(sha256sum sentinel/boot.img | cut -d' ' -f1)"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev libelf-dev \
            python3 python-is-python3 rsync zip unzip cpio lz4 xz-utils git curl build-essential

      - name: Fetch clang toolchain
        run: |
          git clone --depth 1 "https://github.com/${{ inputs.clang_repo }}" "$HOME/tc"
          echo "$HOME/tc/bin" >> "$GITHUB_PATH"
          "$HOME/tc/bin/clang" --version

      # ── 可复现构建 ─────────────────────────────────────────────────────
      # ① KBUILD_BUILD_TIMESTAMP 取该提交的提交时间。LOS 侧没有原厂要对齐，
      #    唯一目标是「同一提交两次构建逐字节相同」；不设则 mkcompile_h 用 `date`。
      # ② kernel/gen_kheaders.sh 的 tar 记录源文件 mtime（= checkout 时刻），压缩后长度每次
      #    不同 —— 实测两次构建差 520 字节，把 kernel_headers_data 之后的约 10MB 整体顶偏
      #    （System.map 里 41,741 行地址随之变化）。SOURCE_DATE_EPOCH 对 GNU tar 无效，须 --mtime。
      # ③ build-id 默认含随机成分；改 sha1 后由内容决定。
      - name: Pin build timestamp (reproducible build)
        run: |
          TS="$(git show -s --format=%cd --date=format-local:'%a %b %-d %H:%M:%S UTC %Y' HEAD)"
          [ -n "$TS" ] || { echo "取不到提交时间"; exit 1; }
          date -d "$TS" +%s > /dev/null || { echo "时间戳无法解析: $TS"; exit 1; }
          echo "KBUILD_BUILD_TIMESTAMP=$TS" >> "$GITHUB_ENV"
          echo "  pinned KBUILD_BUILD_TIMESTAMP = $TS"

      - name: Make the build reproducible
        run: |
          sed -i 's|^tar -Jcf \$tarfile|tar --mtime=@0 --owner=0 --group=0 --numeric-owner -Jcf $tarfile|' kernel/gen_kheaders.sh
          grep -n "Jcf" kernel/gen_kheaders.sh
          sed -i 's|^LDFLAGS_BUILD_ID := .*|LDFLAGS_BUILD_ID := --build-id=sha1|' Makefile
          grep -n "LDFLAGS_BUILD_ID" Makefile

      # ── 修复 ①：Configure 必须带 LLVM=1 ───────────────────────────────
      # 原版只在 Build 步骤加，Configure 没加，导致 AS 回退到宿主 GNU as，
      # Kconfig 调 scripts/as-version.sh，该脚本引用同目录的
      # min-tool-version.sh —— 此文件在 4.19 分支不存在（上游也 404），
      # 于是报 "Sorry, this assembler is not supported."
      #
      # ── 修复 ②：不要用 scripts/kconfig/merge_config.sh ─────────────────
      # 它内部是 KCONFIG_ALLCONFIG + alldefconfig，会把片段里
      # 依赖其它符号的配置项静默丢掉。实测 umi.config 的 22 条只剩 1 条
      # （CONFIG_KSU 侥幸留下，CONFIG_KPROBES / CONFIG_MACH_XIAOMI_UMI
      #  / 触屏 / 指纹 / 充电 / 振动 / 相机 全丢）。
      # 后果一：内核没有 KPROBES → KernelSU 完全不工作。
      # 后果二：CONFIG_MACH_XIAOMI_SM8250 未设 → ufshcd.c 里
      #         #ifndef 守卫的变量变成 unused → 触发 -Werror 编译失败。
      # 改为按顺序拼接进 defconfig（后写覆盖先写），实测 22/22 全部落地。
      - name: Configure
        run: |
          set -e
          cat arch/arm64/configs/${{ inputs.defconfig }} \
              ${{ inputs.fragments }} > /tmp/merged_defconfig
          cp /tmp/merged_defconfig arch/arm64/configs/${{ inputs.defconfig }}
          make O=out ARCH=arm64 LLVM=1 ${{ inputs.defconfig }}
          make O=out ARCH=arm64 LLVM=1 olddefconfig
          if [ "${{ inputs.disable_hardening }}" = "true" ]; then
            # 只关 CFI 与 SCS，**保留 LTO** —— 社区两个能跑的 4.19 SM8250 内核
            # 都是 LTO 开 + CFI 关；关 CFI 不需要关 LTO（CFI_CLANG depends on LTO_CLANG）。
            scripts/config --file out/.config -d CFI_CLANG -d SHADOW_CALL_STACK -d CC_WERROR
            make O=out ARCH=arm64 LLVM=1 olddefconfig
          fi
          echo "==== key config ===="
          grep -E "^CONFIG_(KSU|KPROBES|KPROBE_EVENTS|HAVE_KPROBES|MACH_XIAOMI_UMI|MACH_XIAOMI_SM8250|LTO_CLANG|CFI_CLANG|CC_WERROR|SHADOW_CALL_STACK)=" out/.config || true
          # ⚠️ 硬闸门：这两个必须是 y。历史上 merge_config.sh 静默丢片段，
          #    丢掉 CONFIG_KPROBES ⇒ KernelSU 完全不工作且不报错。宁可让构建挂掉。
          grep -q "^CONFIG_KSU=y$" out/.config
          grep -q "^CONFIG_KPROBES=y$" out/.config
          echo "  ✅ CONFIG_KSU=y / CONFIG_KPROBES=y"

      - name: Build
        run: |
          make O=out ARCH=arm64 LLVM=1 -j"$(nproc)" Image
          ls -lh out/arch/arm64/boot/Image

      # ══════════════════════════════════════════════════════════════════
      #  封装链（issue #5）：编译 → 重打包 → AK3 → 清单 → 闸门 → 来源说明
      #  ⚠️ 这一段的**编排逻辑**在 `.github/scripts/package.py` 里，不在这里。
      #     为什么：本机没有可用的 bash，写在 YAML 里的步骤只能上 CI 试（一轮 20 分钟）；
      #     写成 Python 脚本，同一条链在本机就能跑通 —— 而且本机有已发布批次的输入件，
      #     「重打包出来的 boot.img 与已发布的逐字节相同」是个**强判据**。
      #     workflow 只负责：取底包 → 调它 → 传 artifact。
      # ══════════════════════════════════════════════════════════════════

      # 底包每次都**现拉**（规格实现决定 4）：官方直接单独发布 `boot.img`，不必解 ROM 包。
      # 输出 tee 进日志 —— 来源说明要记期次与来源 URL，那份日志就是它的输入之一。
      - name: "Fetch LineageOS base boot.img (input of the whole chain)"
        env:
          BASE_DATE: ${{ inputs.base_date }}
        run: |
          set -euo pipefail
          ARGS="--latest"
          if [ -n "$BASE_DATE" ]; then
            ARGS="--date $BASE_DATE"
            echo "  ⚠️ 期次被 input 钉住：$BASE_DATE（默认是现拉最新）"
          fi
          python3 .github/scripts/fetch-base.py $ARGS --out base.img | tee base-fetch.log
          echo "  复算件 base.img sha256 = $(sha256sum base.img | cut -d' ' -f1)"

      - name: "Package: repack boot.img + AnyKernel3 + manifest + gate + provenance"
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o ak3-template.tar.gz "$AK3_TEMPLATE_URL"
          python3 .github/scripts/package.py \
            --image out/arch/arm64/boot/Image \
            --config out/.config \
            --system-map out/System.map \
            --base base.img \
            --template ak3-template.tar.gz \
            --template-sha256 "$AK3_TEMPLATE_SHA256" \
            --out-dir dist \
            --repo "${{ github.repository }}" \
            --branch "${{ github.ref_name }}" \
            --commit "${{ github.sha }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --fetch-log base-fetch.log

      # 独立复算：**用另一个工具**（sha256sum，不是 python）再算一遍底包，
      # 与来源说明里记的那一行逐字比对。哨兵的「复算件」是这个路子，这里照做 ——
      # 两条独立路径给出同一个值，才算「来源说明里的底包 sha256 与实际那份一致」。
      - name: "Recount: provenance's base sha256 must equal the actual file"
        run: |
          set -euo pipefail
          GOT="$(sha256sum base.img | cut -d' ' -f1)"
          echo "  实际下载件 sha256 = $GOT"
          if ! grep -qF "| sha256 | \`$GOT\` |" dist/PROVENANCE.md; then
            echo "❌ 来源说明里的底包 sha256 与实际下载件不符。"
            echo "   实际 $GOT"
            echo "   说明里那一节："
            sed -n '/## 二、底包/,/^$/p' dist/PROVENANCE.md
            exit 1
          fi
          echo "  ✅ 与 PROVENANCE.md 记的那一行逐字相同"

      - uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: |
            out/arch/arm64/boot/Image
            out/.config
            out/System.map
          # ⚠️ upload-artifact v4 默认排除隐藏文件 —— .config 以点开头，不开这个就永远传不上去，
          #    而且**不报错**。本项目实测：下载回来的 artifact 里只有 Image，没有 .config。
          include-hidden-files: true
          if-no-files-found: error

      # ⚠️ `if: always()` 是**故意的**：闸门不过时 job 会失败，但产物仍要留下来供事后诊断
      #    （规格用户故事 11）。而闸门不过就不会有 PROVENANCE.md —— 那正是可读的信号。
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: los23.2-umi-${{ github.sha }}
          path: dist/
          include-hidden-files: true
          if-no-files-found: warn
