name: Build Kernel (KernelSU)
on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: base defconfig
        required: true
        default: vendor/kona-perf_defconfig
      fragments:
        description: config fragments (space separated)
        required: false
        default: arch/arm64/configs/vendor/debugfs.config arch/arm64/configs/vendor/xiaomi/sm8250-common.config arch/arm64/configs/vendor/xiaomi/umi.config
      disable_hardening:
        description: disable CFI/SCS/WERROR, keep LTO (true/false)
        required: false
        default: "false"
      clang_repo:
        description: clang prebuilt repo
        required: false
        default: LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b
      sentinel_self_test:
        description: "环境哨兵负向自测：故意换掉已知输入，哨兵必须失败、构建必须中止（true/false）"
        required: false
        default: "false"
      base_date:
        description: "底包期次 YYYY-MM-DD（留空 = 现拉官方最新一期，见规格实现决定 4）。⚠️ 官方只留最近 3 期；**钉住期次**才是「两次构建逐字节相同」的可信前提"
        required: false
        default: ""
      base_run_id:
        description: "复用某次 run 的底包：那个 run 的数字 id（与 base_artifact 配对；两个都留空则本次自己取）"
        required: false
        default: ""
      base_artifact:
        description: "复用某次 run 的底包：artifact 名（如 base-img-<sha>）。与 base_run_id 配对使用"
        required: false
        default: ""
      upstream_sha:
        description: "本批次对应的上游提交（规格 §5 来源说明四项之一；留空 = 未记录，手动触发就是这样）"
        required: false
        default: ""

# ══════════════════════════════════════════════════════════════════════════════
#  两次构建逐字节比对（issue #6，规格实现决定 5 与用户故事 12）
#
#  拓扑：prepare（哨兵 + 取一次底包） → build ×2（两个独立 runner，max-parallel=1）
#        → repro（比对 + 闸门第六项 + 运行摘要）
#
#  ⚠️ 三条不许动的约束，每一条都直接对应一条验收：
#   ① **底包只取一次，由 prepare 分发**。两次各自「现拉最新」的话，官网恰好跨期
#      就会产出**不同的字节**，而那是**假失败**（规格实现决定 4 的原话）。
#      也正因为共用这一份，两个 job 之间才**只有底包**这一个共享输入。
#   ② **两次编译必须落在两个 runner 上**（`max-parallel: 1`）。同一 runner 上连着跑两次
#      会共享 ccache / 临时目录 / 时钟，比对的就不是「独立编译」了。
#   ③ **失败也要把两份产物都留下来**（`if: always()`）。比对失败时，产物本身就是诊断材料。
#
#  ⚠️ 判定入口没有变：仍是 `verify-release.py --line los --repro <第二目录>`（接缝 S1）。
#     `repro-compare.py` 只负责**取证**（差异落在哪个文件、哪一段）与**写摘要**，
#     它不取代闸门 —— 「谁说了算」只有一个答案。
# ══════════════════════════════════════════════════════════════════════════════

jobs:
  # ══ 准备：环境哨兵 + 取一次底包 ═══════════════════════════════════════════════
  # 哨兵放在这里（而不是每个 build 里）的理由：它失败就**根本不该开始编译**，
  # 一次 15 分钟 × 2。它验的是环境（zlib/python），与「哪个 job 在跑」无关。
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    # ⚠️ `permissions:` 一旦写了，**没列出的权限一律变 none**。
    #    `actions: read` 是 `gh api …/actions/runs/<id>/artifacts` 需要的（复用底包那条路）；
    #    `contents: read` 是 checkout 需要的。少了任何一个都只会在**跑起来之后**才报 403。
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ══ ⭐ 环境哨兵（接缝 S2；规格 = **工作区**文档 docs/los-line/upstream-sync-spec.md §6）══
      # 位置：**编译之前的第一步**。它失败 ⇒ 整个 job 立刻中止，不浪费 15 分钟去编译一堆
      #       建立在错误字节上的东西。
      #
      # 判据：把已发布的 CFI 内核装进已发布的正式版壳里，必须**逐字节**得到已发布的
      #       CFI 版 boot.img（sha256 24f29222…）。
      #
      # 为什么非做不可：重打包要用**原版 zlib** 把 ramdisk 重新压缩一遍，输出字节随 zlib
      #   版本变（实测 1.2.11 与 1.2.13 一致；**1.3.x 在已验证区间外**）。runner 镜像一换，
      #   后面每一步都会在错误的字节上盖楼，而且**不会报错**。
      #   ⇒ 这也是 `runs-on` 必须钉死在 ubuntu-22.04 的原因（24.04 的 python3 用 zlib 1.3）。
      #
      # ⚠️ 为什么壳用「正式版」、内核用「CFI 版」：
      #   两个 release 的壳来自**同一份底包**（T6 已证：ramdisk 解压后逐字节相同），而 repack
      #   只从壳里读 ramdisk / dtb / vbmeta / header —— **独独不读壳里的那个内核**。
      #   ⇒ repack(正式版 boot.img, CFI Image) ≡ repack(底包, CFI Image) = CFI 版 boot.img。
      #   这样**期望值与两个输入件三者互不相同**（期望 24f29222… ≠ 壳 4c556237… ≠ 内核 3a9e1c20…），
      #   不会退化成「拿文件跟自己比」—— 那种检查把工具换成一句 `cp` 也照样能过。
      #
      # 本步骤用到的**每一个哈希**都取自**工作区**里的 `docs/manifests/los-releases-sha256.txt`
      # （已发布资产的钉值）。⚠️ 重发资产 / 换 release 之后必须同步改这里 ——
      # 期望值变了，哨兵就该响亮地失败。
      - name: "Environment sentinel — repack must reproduce published bytes"
        env:
          BASE_URL: https://github.com/${{ github.repository }}/releases/download/ksu-v0.9.5-lineage23.2-umi/boot-LOS23.2-ksu-0.9.5-umi.img
          BASE_SHA: 4c556237ded71dba55b27aa2dce18d36b9f2f3de55dbb3df36d52e2b4dc79035
          KERNEL_URL: https://github.com/${{ github.repository }}/releases/download/ksu-v0.9.5-lineage23.2-cfi-umi/Image-micode-4.19.325-perf-gb9c8bf5e4b79-LOS23.2-cfi-ksu-0.9.5
          KERNEL_SHA: 3a9e1c208795179595c60b6ffba25ed33605b179d366bc74b40f28980c2945c1
          EXPECT_SHA: 24f2922235b5ea63819dacee3101cec7d1be964b21cecf5e648da3ad397fc157
          # 负向自测用的**另一对**已发布件（同样是钉死的哈希）
          ALT_BASE_URL: https://github.com/${{ github.repository }}/releases/download/ksu-v0.9.5-lineage23.2-cfi-umi/boot-LOS23.2-cfi-ksu-0.9.5-umi.img
          ALT_BASE_SHA: 24f2922235b5ea63819dacee3101cec7d1be964b21cecf5e648da3ad397fc157
          ALT_KERNEL_URL: https://github.com/${{ github.repository }}/releases/download/ksu-v0.9.5-lineage23.2-umi/Image-micode-4.19.325-perf-gb9c8bf5e4b79-LOS23.2-ksu-0.9.5
          ALT_KERNEL_SHA: 0157c33f9a4a048cde921402ba832c666436671b4426851370c21864a86c4334
          SELF_TEST: ${{ inputs.sentinel_self_test }}
        run: |
          set -euo pipefail
          mkdir -p sentinel
          echo "python3 : $(python3 -VV)"
          echo "zlib    : $(python3 -c 'import zlib; print(zlib.ZLIB_VERSION, zlib.ZLIB_RUNTIME_VERSION)')"
          echo "runner  : ${ImageOS:-?} ${ImageVersion:-?}"

          if [ "$SELF_TEST" = "true" ]; then
            echo "⚠️  负向自测模式：壳 正式版→CFI 版、内核 CFI 版→正式版，**期望值不动**"
            echo "    本步骤**必须失败** —— 它通过就说明哨兵（或重打包工具）已经坏了。"
            echo "    下面报的『最可能的原因』对本次**不适用**：真因是输入被**故意**换掉了。"
            BASE_URL="$ALT_BASE_URL"
            BASE_SHA="$ALT_BASE_SHA"
            KERNEL_URL="$ALT_KERNEL_URL"
            KERNEL_SHA="$ALT_KERNEL_SHA"
          fi

          # 输入件也要钉死：否则 release 上的资产被换掉时，哨兵会"通过"一次错的比对。
          fetch () {  # $1=URL  $2=期望 sha256  $3=落地路径
            curl -fsSL --retry 3 --retry-delay 2 -o "$3" "$1"
            local got
            got="$(sha256sum "$3" | cut -d' ' -f1)"
            if [ "$got" != "$2" ]; then
              echo "❌ 输入件不是期望的那一份: $3"
              echo "   期望 $2"
              echo "   实际 $got"
              echo "   ⇒ 最可能的原因：release 上的资产被重新上传/删除（哈希清单该更新了），"
              echo "     或下载被截断（大文件会静默截断，见项目文档 PROJECT.md §7 坑表 #21）。"
              exit 1
            fi
            echo "✅ 输入件 $3  $got"
          }

          fetch "$BASE_URL"   "$BASE_SHA"   sentinel/base.img
          fetch "$KERNEL_URL" "$KERNEL_SHA" sentinel/kernel.img

          # ★ 判据本体。失败时工具自己会打印「期望 / 实际 / 最可能的原因」三件事。
          python3 .github/scripts/repack-boot.py sentinel/base.img sentinel/kernel.img -o sentinel/boot.img --expect "$EXPECT_SHA"

          echo "✅ 环境哨兵通过：本 runner 的重打包环境与已发布件逐字节一致"
          echo "   复算件 sentinel/boot.img sha256 = $(sha256sum sentinel/boot.img | cut -d' ' -f1)"

      # ── 取底包：**整条运行只取一次**，两个 build job 共用这一份 ────────────────
      # ⚠️ 这是「两次构建**不共享底包以外的任何输入**」这句验收的落地方式：
      #   底包是**唯一**被共享的输入（它本身就是产物不可复现的天然来源之一 —— 换一期就换字节），
      #   其余一切（checkout、工具链、模板）都在各自的 job 里独立取得。
      # ⚠️ 为什么必须由 job 分发而不是「两次各拉最新」：官网每周换一期，两次相隔几分钟，
      #   恰好跨期就会产出**不同的字节** —— 而那是**假失败**（规格实现决定 4）。
      - name: "Fetch LineageOS base boot.img (once per run, shared by both builds)"
        env:
          BASE_DATE: ${{ inputs.base_date }}
          BASE_RUN_ID: ${{ inputs.base_run_id }}
          BASE_ARTIFACT: ${{ inputs.base_artifact }}
          GH_TOKEN: ${{ github.token }}
          # ⚠️ `gh api` 在下面的内联 python 里被调用（下载 artifact 的 zip 要用它带凭据），
          #    而 python 不好直接拿到 `${{ github.repository }}` ⇒ 走环境变量。
          GH_REPO: ${{ github.repository }}
          # ⚠️ `|2` = 「内容相对父级再缩进 2 格」，于是**内容自己顶格**（不带公共缩进）——
          #    这正是 `python3 -c` 要的形态。用 `|` 的话内容会带着 10 空格缩进，必炸
          #    （本机实测：`IndentationError: unexpected indent`）。
          PY_PICK: |2
            import json
            import os
            import subprocess
            import sys
            import zipfile

            meta_path, out_dir, want = sys.argv[1], sys.argv[2], sys.argv[3]
            arts = json.load(open(meta_path, encoding="utf-8")).get("artifacts") or []
            hit = [a for a in arts if a.get("name") == want]
            if not hit:
                sys.stderr.write("这个 run 里没有名为 %r 的 artifact。可用：\n" % want)
                for a in arts:
                    sys.stderr.write("   %s\n" % a.get("name"))
                raise SystemExit(1)
            aid = max(hit, key=lambda a: a.get("created_at") or "")["id"]
            with open("artifact.zip", "wb") as f:
                rc = subprocess.run(["gh", "api", "repos/%s/actions/artifacts/%d/zip"
                                     % (os.environ["GH_REPO"], aid)], stdout=f).returncode
            if rc:
                raise SystemExit("gh api 下载 artifact %d 失败（退出码 %d）" % (aid, rc))
            os.makedirs(out_dir, exist_ok=True)
            with zipfile.ZipFile("artifact.zip") as z:
                z.extractall(out_dir)
                print("  已取 artifact %d（%s），内含：" % (aid, want))
                for i in z.infolist():
                    print("    %s" % i.filename)
        run: |
          set -euo pipefail
          if [ -n "$BASE_ARTIFACT" ] || [ -n "$BASE_RUN_ID" ]; then
            # ⚠️ **两个都要给**：artifact 名不是唯一的（同一个 `base-img-<sha>` 可能被重跑
            #    传过多次，GitHub 存的是**每一次上传**），所以先按 run 缩范围、再挑最新的那个。
            # ⚠️ 这里两处写法都是**本机实测过**才敢写进来的（2026-09-26，两次踩坑）：
            #    ① `gh run download <x>` 的第一个参数是 **run id**，不是 artifact 名 ——
            #       把名字传进去会去请求 `.../runs/<名字>/artifacts` ⇒ 404。
            #    ② `python3 -c '…'` 里的代码**不能带 YAML 块缩进**（见上面 `PY_PICK`）。
            [ -n "$BASE_ARTIFACT" ] && [ -n "$BASE_RUN_ID" ] || {
              echo "❌ base_artifact 与 base_run_id 必须成对给出（只给一个无法定位那一份）"
              exit 1
            }
            echo "⚠️ 复用 run ${BASE_RUN_ID} 的底包 artifact：$BASE_ARTIFACT（本次不联网取底包）"
            gh api "repos/${{ github.repository }}/actions/runs/${BASE_RUN_ID}/artifacts?per_page=100" \
              > artifacts-meta.json
            python3 -c "$PY_PICK" artifacts-meta.json reused-base "$BASE_ARTIFACT"
            BASE="$(find reused-base -maxdepth 1 -name 'base*.img' | head -1)"
            [ -n "$BASE" ] || { echo "❌ $BASE_ARTIFACT 里找不到 base*.img"; exit 1; }
            cp "$BASE" base.img
            BSHA="$(sha256sum base.img | cut -d' ' -f1)"
            # ⚠️ 这份日志要写成 `fetch-base.py` **同样的三行形状**（期次 / 来源 / 官方 sha256）
            #    —— `make-provenance.py` 按那个形状解析，写歪了会让**封装链整条中止**
            #    （2026-09-26 实测踩到：第一版来源写成 `artifact:<run>/<name>`，
            #    正则匹配不上 ⇒ 停在「写来源说明」那一步，而编译本身是好的）。
            #    来源如实写成 `artifact:<run>/<name>`；`date` 位写「复用的期次」，
            #    没有钉期次时如实写「（未钉期次）」，**不编一个日期**。
            { echo "期次   ${BASE_DATE:-（未钉期次）}"
              echo "来源   artifact:${BASE_RUN_ID}/${BASE_ARTIFACT}"
              echo "官方   $(stat -c%s base.img) 字节  sha256 $BSHA"
            } > base-fetch.log
            echo "  复算件 base.img sha256 = $BSHA"
            exit 0
          fi
          ARGS="--latest"
          if [ -n "$BASE_DATE" ]; then
            ARGS="--date $BASE_DATE"
            echo "  ⚠️ 期次被 input 钉住：$BASE_DATE（默认是现拉最新）"
          fi
          python3 .github/scripts/fetch-base.py $ARGS --out base.img | tee base-fetch.log
          echo "  复算件 base.img sha256 = $(sha256sum base.img | cut -d' ' -f1)"

      # ⚠️ 独立复算：**用另一个工具**（sha256sum，不是 python）再算一遍底包。
      #    这一步是为两次构建准备输入 —— 输入的哈希必须在两个 job 之**前**就定下来，
      #    否则「两份产物用了同一份底包」只是口头约定。
      - name: "Record the base sha256 (the one input both builds will share)"
        run: |
          set -euo pipefail
          GOT="$(sha256sum base.img | cut -d' ' -f1)"
          echo "  实际下载件 sha256 = $GOT"
          if ! grep -qF "$GOT" base-fetch.log; then
            echo "❌ 取底包那一步记下的 sha256 与实际文件不符。"
            echo "   实际 $GOT"
            sed -n '1,20p' base-fetch.log
            exit 1
          fi
          echo "  ✅ 与取底包那一步记的那一行一致"
          echo "$GOT" > base.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: base-img-${{ github.sha }}
          path: |
            base.img
            base-fetch.log
            base.sha256
          if-no-files-found: error

  # ══ 编译 ×2：两个独立 runner，串行（见文件头约束 ②）═══════════════════════════
  build:
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    strategy:
      # ⚠️ max-parallel=1 是**故意的**：两次编译必须落在**两个不同的 runner** 上
      #    （并行也行，但那要多占一份并发额度；串行的总时长仍在那条 3 小时的超时内）。
      #    同一 runner 上连着跑两次会共享 ccache / 临时目录 / 时钟 ⇒ 比对的就不是独立编译。
      max-parallel: 1
      fail-fast: false
      matrix:
        pass: [a, b]
    env:
      # ── 可复现构建：三个变量必须固定 ──────────────────────────────────
      # scripts/mkcompile_h L37-51：不设则退回 `date` / `whoami` / `uname -n`，
      # 而 GitHub runner 的主机名每次随机 ⇒ 两次构建的 uname -v 与 banner 必不同。
      TZ: UTC
      KBUILD_BUILD_USER: bonger
      KBUILD_BUILD_HOST: github-actions
      # ── 封装链用到的 AK3 模板钉值（issue #5）────────────────────────────
      # ⚠️ 上游 `osm0sis/AnyKernel3@master` 是**会动**的：它变了，zip 的字节就会变
      #    （anykernel.sh 的内容与 tools/magiskboot 都会进 zip）。钉住 ⇒ 上游一改版
      #    **当场失败**，而不是悄悄产出一批用别的模板做的 zip。
      #    要接受新模板就改这一行 —— 那是**人的决定**，不该由构建代劳。
      AK3_TEMPLATE_URL: https://codeload.github.com/osm0sis/AnyKernel3/tar.gz/refs/heads/master
      AK3_TEMPLATE_SHA256: a74f8acd2a0855460e16c31a79db344b22c22f082432d946d2db3c727f59a921
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 两份编译的输入必须**逐字节相同**。底下是 prepare 算好的那一份，不是各拉各的。
      - name: "Download the shared base boot.img (the only shared input)"
        uses: actions/download-artifact@v4
        with:
          name: base-img-${{ github.sha }}

      - name: "Show what this pass got"
        run: |
          set -euo pipefail
          ls -l base.img base-fetch.log base.sha256
          echo "  底包 sha256（prepare 记下的）= $(cat base.sha256)"
          echo "  本 pass 复算                = $(sha256sum base.img | cut -d' ' -f1)"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev libelf-dev \
            python3 python-is-python3 rsync zip unzip cpio lz4 xz-utils git curl build-essential

      - name: Fetch clang toolchain
        run: |
          git clone --depth 1 "https://github.com/${{ inputs.clang_repo }}" "$HOME/tc"
          echo "$HOME/tc/bin" >> "$GITHUB_PATH"
          "$HOME/tc/bin/clang" --version

      # ── 可复现构建 ─────────────────────────────────────────────────────
      # ① KBUILD_BUILD_TIMESTAMP 取该提交的提交时间。LOS 侧没有原厂要对齐，
      #    唯一目标是「同一提交两次构建逐字节相同」；不设则 mkcompile_h 用 `date`。
      #    两次编译检出的是**同一个提交**（同一 run 的 github.sha）⇒ 这个值两份相同。
      # ② kernel/gen_kheaders.sh 的 tar 记录源文件 mtime（= checkout 时刻），压缩后长度每次
      #    不同 —— 实测两次构建差 520 字节，把 kernel_headers_data 之后的约 10MB 整体顶偏
      #    （System.map 里 41,741 行地址随之变化）。SOURCE_DATE_EPOCH 对 GNU tar 无效，须 --mtime。
      # ③ build-id 默认含随机成分；改 sha1 后由内容决定。
      - name: Pin build timestamp (reproducible build)
        run: |
          TS="$(git show -s --format=%cd --date=format-local:'%a %b %-d %H:%M:%S UTC %Y' HEAD)"
          [ -n "$TS" ] || { echo "取不到提交时间"; exit 1; }
          date -d "$TS" +%s > /dev/null || { echo "时间戳无法解析: $TS"; exit 1; }
          echo "KBUILD_BUILD_TIMESTAMP=$TS" >> "$GITHUB_ENV"
          echo "  pinned KBUILD_BUILD_TIMESTAMP = $TS"

      - name: Make the build reproducible
        run: |
          sed -i 's|^tar -Jcf \$tarfile|tar --mtime=@0 --owner=0 --group=0 --numeric-owner -Jcf $tarfile|' kernel/gen_kheaders.sh
          grep -n "Jcf" kernel/gen_kheaders.sh
          sed -i 's|^LDFLAGS_BUILD_ID := .*|LDFLAGS_BUILD_ID := --build-id=sha1|' Makefile
          grep -n "LDFLAGS_BUILD_ID" Makefile

      # ── 修复 ①：Configure 必须带 LLVM=1 ───────────────────────────────
      # 原版只在 Build 步骤加，Configure 没加，导致 AS 回退到宿主 GNU as，
      # Kconfig 调 scripts/as-version.sh，该脚本引用同目录的
      # min-tool-version.sh —— 此文件在 4.19 分支不存在（上游也 404），
      # 于是报 "Sorry, this assembler is not supported."
      #
      # ── 修复 ②：不要用 scripts/kconfig/merge_config.sh ─────────────────
      # 它内部是 KCONFIG_ALLCONFIG + alldefconfig，会把片段里
      # 依赖其它符号的配置项静默丢掉。实测 umi.config 的 22 条只剩 1 条
      # （CONFIG_KSU 侥幸留下，CONFIG_KPROBES / CONFIG_MACH_XIAOMI_UMI
      #  / 触屏 / 指纹 / 充电 / 振动 / 相机 全丢）。
      # 后果一：内核没有 KPROBES → KernelSU 完全不工作。
      # 后果二：CONFIG_MACH_XIAOMI_SM8250 未设 → ufshcd.c 里
      #         #ifndef 守卫的变量变成 unused → 触发 -Werror 编译失败。
      # 改为按顺序拼接进 defconfig（后写覆盖先写），实测 22/22 全部落地。
      - name: Configure
        run: |
          set -e
          cat arch/arm64/configs/${{ inputs.defconfig }} \
              ${{ inputs.fragments }} > /tmp/merged_defconfig
          cp /tmp/merged_defconfig arch/arm64/configs/${{ inputs.defconfig }}
          make O=out ARCH=arm64 LLVM=1 ${{ inputs.defconfig }}
          make O=out ARCH=arm64 LLVM=1 olddefconfig
          if [ "${{ inputs.disable_hardening }}" = "true" ]; then
            # 只关 CFI 与 SCS，**保留 LTO** —— 社区两个能跑的 4.19 SM8250 内核
            # 都是 LTO 开 + CFI 关；关 CFI 不需要关 LTO（CFI_CLANG depends on LTO_CLANG）。
            scripts/config --file out/.config -d CFI_CLANG -d SHADOW_CALL_STACK -d CC_WERROR
            make O=out ARCH=arm64 LLVM=1 olddefconfig
          fi
          echo "==== key config ===="
          grep -E "^CONFIG_(KSU|KPROBES|KPROBE_EVENTS|HAVE_KPROBES|MACH_XIAOMI_UMI|MACH_XIAOMI_SM8250|LTO_CLANG|CFI_CLANG|CC_WERROR|SHADOW_CALL_STACK)=" out/.config || true
          # ⚠️ 硬闸门：这两个必须是 y。历史上 merge_config.sh 静默丢片段，
          #    丢掉 CONFIG_KPROBES ⇒ KernelSU 完全不工作且不报错。宁可让构建挂掉。
          grep -q "^CONFIG_KSU=y$" out/.config
          grep -q "^CONFIG_KPROBES=y$" out/.config
          echo "  ✅ CONFIG_KSU=y / CONFIG_KPROBES=y"

      - name: Build
        run: |
          make O=out ARCH=arm64 LLVM=1 -j"$(nproc)" Image
          ls -lh out/arch/arm64/boot/Image

      # ══════════════════════════════════════════════════════════════════
      #  封装链（issue #5）：编译 → 重打包 → AK3 → 清单 → 闸门 → 来源说明
      #  ⚠️ 这一段的**编排逻辑**在 `.github/scripts/package.py` 里，不在这里。
      #     为什么：本机没有可用的 bash，写在 YAML 里的步骤只能上 CI 试（一轮 20 分钟）；
      #     写成 Python 脚本，同一条链在本机就能跑通 —— 而且本机有已发布批次的输入件，
      #     「重打包出来的 boot.img 与已发布的逐字节相同」是个**强判据**。
      #     workflow 只负责：取底包 → 调它 → 传 artifact。
      # ⚠️ 底包已由 prepare 取好（`base.img` 就在工作目录里），这里**不再**取。
      # ══════════════════════════════════════════════════════════════════

      - name: "Package: repack boot.img + AnyKernel3 + manifest + gate + provenance"
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o ak3-template.tar.gz "$AK3_TEMPLATE_URL"
          python3 .github/scripts/package.py \
            --image out/arch/arm64/boot/Image \
            --config out/.config \
            --system-map out/System.map \
            --base base.img \
            --template ak3-template.tar.gz \
            --template-sha256 "$AK3_TEMPLATE_SHA256" \
            --out-dir dist \
            --repo "${{ github.repository }}" \
            --branch "${{ github.ref_name }}" \
            --commit "${{ github.sha }}" \
            --upstream-sha "${{ inputs.upstream_sha }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --fetch-log base-fetch.log

      # 独立复算：**用另一个工具**（sha256sum，不是 python）再算一遍底包，
      # 与来源说明里记的那一行逐字比对。哨兵的「复算件」是这个路子，这里照做 ——
      # 两条独立路径给出同一个值，才算「来源说明里的底包 sha256 与实际那份一致」。
      - name: "Recount: provenance's base sha256 must equal the actual file"
        run: |
          set -euo pipefail
          GOT="$(sha256sum base.img | cut -d' ' -f1)"
          echo "  实际下载件 sha256 = $GOT"
          if ! grep -qF "| sha256 | \`$GOT\` |" dist/PROVENANCE.md; then
            echo "❌ 来源说明里的底包 sha256 与实际下载件不符。"
            echo "   实际 $GOT"
            echo "   说明里那一节："
            sed -n '/## 二、底包/,/^$/p' dist/PROVENANCE.md
            exit 1
          fi
          echo "  ✅ 与 PROVENANCE.md 记的那一行逐字相同"

      # ⚠️ 两次编译的输入必须逐字节相同 —— 这是「两次构建不共享底包以外的输入」的反面。
      #    把它做成**显式的一步**：两份都比对 prepare 记下的那个哈希，
      #    于是「两次用的不是同一份底包」会在这里当场失败，而不是在比对那一步变成
      #    一条难读的「Image 两次构建不同」。
      - name: "Assert: this pass used the shared base"
        run: |
          set -euo pipefail
          WANT="$(cat base.sha256)"
          GOT="$(sha256sum base.img | cut -d' ' -f1)"
          [ "$WANT" = "$GOT" ] || { echo "❌ 本 pass 用的底包不是 prepare 分发的那一份"; exit 1; }
          echo "  ✅ 底包与 prepare 分发的那一份相同：$GOT"

      - uses: actions/upload-artifact@v4
        with:
          name: kernel-image-${{ matrix.pass }}
          path: |
            out/arch/arm64/boot/Image
            out/.config
            out/System.map
          # ⚠️ upload-artifact v4 默认排除隐藏文件 —— .config 以点开头，不开这个就永远传不上去，
          #    而且**不报错**。本项目实测：下载回来的 artifact 里只有 Image，没有 .config。
          include-hidden-files: true
          if-no-files-found: error

      # ⚠️ `if: always()` 是**故意的**：闸门不过、或整条链某一步失败时，产物仍要留下来
      #    供事后诊断（规格用户故事 11）。⚠️ 注意此时 dist 里**可能已经有一份
      #    PROVENANCE.md** —— 它写在**预检之后、终检之前**，所以它记的是「预检通过」
      #    而不是整条链的结论。这正是那份文件第五节明说「最终结论看 CI run 的状态」的原因。
      # ⚠️ 两次运行各传各的（名字带 `matrix.pass`）：比对失败时**两份都要在**，
      #    只留一份就永远查不出差异落在哪里。
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: los23.2-umi-${{ github.sha }}-${{ matrix.pass }}
          path: dist/
          include-hidden-files: true
          if-no-files-found: warn

  # ══ 比对：取证 + 判定 + 运行摘要（issue #6 的核心）═════════════════════════════
  # ⚠️ `if: always()`：两次编译**任一失败**时这一节照样要跑 ——
  #    ① 失败的那次仍有 dist（上传那一步是 always）；
  #    ② 摘要里要说清「这一节为什么没得出结论」，而不是整节消失。
  repro:
    needs: [prepare, build]
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: "Download both passes' artifacts (both must survive, even on failure)"
        uses: actions/download-artifact@v4
        with:
          pattern: los23.2-umi-${{ github.sha }}-*
          path: repro
        # ⚠️ 不设 continue-on-error：**拿不到两份产物本身就是要报的错**。
        #    「下载失败所以跳过比对」会让一次没跑成的比对看起来像通过。

      - name: "Show what was downloaded"
        run: |
          ls -lR repro | head -40
          for p in a b; do
            d="repro/los23.2-umi-${{ github.sha }}-$p"
            if [ ! -d "$d" ]; then
              echo "❌ 缺少 pass $p 的产物目录：$d —— 比对无从谈起。"
              echo "   两份产物都要留下（上传那一步是 if: always()）；缺一份就说明它没产出。"
              exit 1
            fi
            n=$(find "$d" -type f | wc -l)
            [ "$n" -gt 0 ] || { echo "❌ pass $p 的产物目录是空的"; exit 1; }
            echo "  pass $p：$n 个文件"
          done

      # ★ 取证：逐字节比两份，并把报告写进运行摘要（`$GITHUB_STEP_SUMMARY`）。
      #   ⚠️ 这一步**故意不因差异而红** —— 判定归闸门（下一步）；
      #      它失败时这一步仍会把「差异落在哪个字节」写进摘要并打印出来。
      - name: "Byte-for-byte comparison → run summary"
        run: |
          set -euo pipefail
          python3 .github/scripts/repro-compare.py \
            "repro/los23.2-umi-${{ github.sha }}-a" \
            "repro/los23.2-umi-${{ github.sha }}-b" \
            --summary "$GITHUB_STEP_SUMMARY"

      # ★ 判定：闸门第六项（接缝 S1 —— 「这批产物能不能发」的唯一入口）。
      #   ⚠️ `--profile auto`：**档位从产物的 `.config` 现推**，不由这里指定。
      #      理由（2026-09-26 实测踩到）：档位取决于构建时 `disable_hardening` 传了什么，
      #      而那是**另一个地方**的事 —— 写成 `--profile main` 时，一旦这次编出来的是
      #      CFI 档，闸门就会因为**调用方把参数传错**而红。让工具自己读 `.config`
      #      就没有这处耦合（`package.py` 的命名与档位早就是现算的，见 spec 决定 26 ③）。
      #   ⚠️ **先写摘要再退非零**：`run:` 一旦非零，后面的步骤就不跑了，
      #      而「不一致时摘要里也要看得见」正是上面那一步的全部用途。
      #      （同一形状的教训：PROJECT.md §7 坑表 #34 —— 早写下的结论会被晚发生的事推翻。）
      - name: "Gate: verify-release.py --line los --repro (the only verdict)"
        run: |
          set +e
          python3 .github/scripts/verify-release.py \
            "repro/los23.2-umi-${{ github.sha }}-a" \
            --line los --profile auto \
            --repro "repro/los23.2-umi-${{ github.sha }}-b"
          RC=$?
          {
            echo ""
            echo "## 判定（接缝 S1）"
            echo ""
            echo '```'
            echo "verify-release.py --line los --repro  →  exit $RC"
            echo '```'
            echo ""
            echo "闸门是**唯一**的判定入口；上面的逐字节报告只负责取证。"
            echo "退出码 0 = 两次构建逐字节相同（且三件套、KSU 符号、同源、哈希清单都过）。"
          } >> "$GITHUB_STEP_SUMMARY"
          exit $RC
